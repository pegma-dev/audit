# Publishes the exact tarball prepared from a stable GitHub release tag.
# Authentication is npm trusted-publisher OIDC only; no token fallback exists.

name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs['artifact-id'] }}
      manifest_digest: ${{ steps.manifest.outputs.digest }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
      RELEASE_COMMIT: ${{ github.sha }}
      RELEASE_ALLOWED_SIGNERS: ${{ vars.RELEASE_ALLOWED_SIGNERS }}

    steps:
      - name: Authenticate the release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RELEASE_PRERELEASE}" != "false" ]]; then
            echo "::error::Only stable releases may publish"
            exit 1
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^v(0\.[1-9][0-9]*|[1-9][0-9]*\.[0-9]+)\.[0-9]+$ ]]; then
            echo "::error::The release tag must be a stable vX.Y.Z tag"
            exit 1
          fi
          if [[ ! "${RELEASE_COMMIT}" =~ ^[0-9A-Fa-f]{40}$ ]]; then
            echo "::error::The release event must identify one commit"
            exit 1
          fi
          if [[ -z "${RELEASE_ALLOWED_SIGNERS//[[:space:]]/}" ]]; then
            echo "::error::RELEASE_ALLOWED_SIGNERS must contain the reviewed SSH allowed-signers entries"
            exit 1
          fi

          auth_root="$(mktemp -d "${RUNNER_TEMP}/audit-release-auth.XXXXXX")"
          trap 'rm -rf "${auth_root}"' EXIT
          repository="${auth_root}/repository.git"
          allowed_signers="${auth_root}/allowed-signers"
          umask 077
          printf '%s\n' "${RELEASE_ALLOWED_SIGNERS}" > "${allowed_signers}"
          chmod 0600 "${allowed_signers}"
          git init --bare --quiet "${repository}"
          git -C "${repository}" config gpg.format ssh
          git -C "${repository}" config gpg.ssh.allowedSignersFile "${allowed_signers}"
          git -C "${repository}" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "${repository}" fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          [[ "$(git -C "${repository}" cat-file -t "refs/tags/${RELEASE_TAG}")" == "tag" ]]
          git -C "${repository}" verify-tag "${RELEASE_TAG}"
          tag_commit="$(git -C "${repository}" rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          [[ "${tag_commit}" == "${RELEASE_COMMIT,,}" ]]
          git -C "${repository}" merge-base --is-ancestor \
            "${RELEASE_COMMIT}" refs/remotes/origin/main

      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Use the reviewed npm release
        shell: bash
        env:
          REVIEWED_NPM_VERSION: 11.18.0
          REVIEWED_NPM_INTEGRITY: sha512-T67M4L5wNm0cZ7EBLErcEkY1SmzEW/WJ+SADBzsFUY1UdAPfFHXFQtZ6SEXiK0+vzXysCvAsepbMaBTwnrAD+w==
        run: |
          set -euo pipefail
          tarball="${RUNNER_TEMP}/npm-${REVIEWED_NPM_VERSION}.tgz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "${tarball}" \
            "https://registry.npmjs.org/npm/-/npm-${REVIEWED_NPM_VERSION}.tgz"
          actual_integrity="$(node - "${tarball}" <<'NODE'
          const { createHash } = require("node:crypto");
          const { readFileSync } = require("node:fs");
          const bytes = readFileSync(process.argv[2]);
          process.stdout.write(`sha512-${createHash("sha512").update(bytes).digest("base64")}`);
          NODE
          )"
          [[ "${actual_integrity}" == "${REVIEWED_NPM_INTEGRITY}" ]]
          npm install --global "${tarball}" --ignore-scripts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Check types
        run: pnpm run check

      - name: Run tests
        run: pnpm test

      - name: Prepare the release tarball
        run: pnpm run release:pack -- --require-clean --require-main-ancestor --expected-release-commit "${RELEASE_COMMIT}" --output .release

      - name: Record the package manifest digest
        id: manifest
        shell: bash
        run: |
          digest="$(node -e 'const { createHash } = require("node:crypto"); const { readFileSync } = require("node:fs"); process.stdout.write(createHash("sha256").update(readFileSync(".release/package-manifest.json")).digest("hex"));')"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Upload the prepared release
        id: upload
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: audit-release-${{ github.run_id }}
          path: .release/
          if-no-files-found: error
          include-hidden-files: false
          overwrite: true
          retention-days: 30

  smoke:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Use the reviewed npm release
        shell: bash
        env:
          REVIEWED_NPM_VERSION: 11.18.0
          REVIEWED_NPM_INTEGRITY: sha512-T67M4L5wNm0cZ7EBLErcEkY1SmzEW/WJ+SADBzsFUY1UdAPfFHXFQtZ6SEXiK0+vzXysCvAsepbMaBTwnrAD+w==
        run: |
          set -euo pipefail
          tarball="${RUNNER_TEMP}/npm-${REVIEWED_NPM_VERSION}.tgz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "${tarball}" \
            "https://registry.npmjs.org/npm/-/npm-${REVIEWED_NPM_VERSION}.tgz"
          actual_integrity="$(node - "${tarball}" <<'NODE'
          const { createHash } = require("node:crypto");
          const { readFileSync } = require("node:fs");
          const bytes = readFileSync(process.argv[2]);
          process.stdout.write(`sha512-${createHash("sha512").update(bytes).digest("base64")}`);
          NODE
          )"
          [[ "${actual_integrity}" == "${REVIEWED_NPM_INTEGRITY}" ]]
          npm install --global "${tarball}" --ignore-scripts

      - name: Download the prepared release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: .release

      - name: Verify the prepared release
        id: prepared
        shell: bash
        env:
          EXPECTED_MANIFEST_DIGEST: ${{ needs.prepare.outputs.manifest_digest }}
          RELEASE_DIRECTORY: ${{ github.workspace }}/.release
        run: |
          node <<'NODE'
          const { createHash } = require("node:crypto");
          const { appendFileSync, lstatSync, readFileSync, readdirSync } = require("node:fs");
          const { join } = require("node:path");
          const directory = process.env.RELEASE_DIRECTORY;
          const manifestPath = join(directory, "package-manifest.json");
          const manifestBytes = readFileSync(manifestPath);
          const manifestDigest = createHash("sha256").update(manifestBytes).digest("hex");
          if (manifestDigest !== process.env.EXPECTED_MANIFEST_DIGEST) {
            throw new Error("prepared package manifest digest does not match preparation");
          }
          const manifest = JSON.parse(manifestBytes);
          const record = manifest.package;
          if (
            manifest.schemaVersion !== 1 ||
            record?.name !== "@pegma/audit" ||
            !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(record.version) ||
            !/^[0-9a-f]{64}$/.test(record.sha256) ||
            typeof record.integrity !== "string"
          ) throw new Error("prepared package manifest is invalid");
          const expectedTarball = `pegma-audit-${record.version}.tgz`;
          if (record.tarball !== expectedTarball) throw new Error("prepared tarball name is invalid");
          const entries = readdirSync(directory, { withFileTypes: true });
          const names = entries.map(({ name }) => name).sort();
          if (JSON.stringify(names) !== JSON.stringify([expectedTarball, "package-manifest.json"].sort())) {
            throw new Error("prepared release inventory is invalid");
          }
          for (const entry of entries) {
            if (!entry.isFile() || entry.isSymbolicLink() || !lstatSync(join(directory, entry.name)).isFile()) {
              throw new Error(`prepared release entry is not a regular file: ${entry.name}`);
            }
          }
          const tarballPath = join(directory, expectedTarball);
          const bytes = readFileSync(tarballPath);
          const sha256 = createHash("sha256").update(bytes).digest("hex");
          const integrity = `sha512-${createHash("sha512").update(bytes).digest("base64")}`;
          if (sha256 !== record.sha256 || integrity !== record.integrity) {
            throw new Error("prepared tarball digest does not match its manifest");
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `tarball=${tarballPath}\nname=${record.name}\n`);
          NODE

      - name: Import from a clean consumer
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.prepared.outputs.name }}
          PACKAGE_TARBALL: ${{ steps.prepared.outputs.tarball }}
        run: |
          set -euo pipefail
          consumer="$(mktemp -d "${RUNNER_TEMP}/audit-release-smoke.XXXXXX")"
          printf '%s\n' '{"name":"audit-release-smoke","private":true,"type":"module"}' > "${consumer}/package.json"
          cd "${consumer}"
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false "${PACKAGE_TARBALL}"
          node --input-type=module --eval "await import(${PACKAGE_NAME@Q})"

  publish:
    needs: [prepare, smoke]
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
      RELEASE_COMMIT: ${{ github.sha }}
      RELEASE_ALLOWED_SIGNERS: ${{ vars.RELEASE_ALLOWED_SIGNERS }}

    steps:
      - name: Authenticate the release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RELEASE_PRERELEASE}" != "false" ]]; then
            echo "::error::Only stable releases may publish"
            exit 1
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^v(0\.[1-9][0-9]*|[1-9][0-9]*\.[0-9]+)\.[0-9]+$ ]]; then
            echo "::error::The release tag must be a stable vX.Y.Z tag"
            exit 1
          fi
          if [[ ! "${RELEASE_COMMIT}" =~ ^[0-9A-Fa-f]{40}$ ]]; then
            echo "::error::The release event must identify one commit"
            exit 1
          fi
          if [[ -z "${RELEASE_ALLOWED_SIGNERS//[[:space:]]/}" ]]; then
            echo "::error::RELEASE_ALLOWED_SIGNERS must contain the reviewed SSH allowed-signers entries"
            exit 1
          fi

          auth_root="$(mktemp -d "${RUNNER_TEMP}/audit-release-auth.XXXXXX")"
          trap 'rm -rf "${auth_root}"' EXIT
          repository="${auth_root}/repository.git"
          allowed_signers="${auth_root}/allowed-signers"
          umask 077
          printf '%s\n' "${RELEASE_ALLOWED_SIGNERS}" > "${allowed_signers}"
          chmod 0600 "${allowed_signers}"
          git init --bare --quiet "${repository}"
          git -C "${repository}" config gpg.format ssh
          git -C "${repository}" config gpg.ssh.allowedSignersFile "${allowed_signers}"
          git -C "${repository}" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "${repository}" fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          [[ "$(git -C "${repository}" cat-file -t "refs/tags/${RELEASE_TAG}")" == "tag" ]]
          git -C "${repository}" verify-tag "${RELEASE_TAG}"
          tag_commit="$(git -C "${repository}" rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          [[ "${tag_commit}" == "${RELEASE_COMMIT,,}" ]]
          git -C "${repository}" merge-base --is-ancestor \
            "${RELEASE_COMMIT}" refs/remotes/origin/main

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Use the reviewed npm release
        shell: bash
        env:
          REVIEWED_NPM_VERSION: 11.18.0
          REVIEWED_NPM_INTEGRITY: sha512-T67M4L5wNm0cZ7EBLErcEkY1SmzEW/WJ+SADBzsFUY1UdAPfFHXFQtZ6SEXiK0+vzXysCvAsepbMaBTwnrAD+w==
        run: |
          set -euo pipefail
          tarball="${RUNNER_TEMP}/npm-${REVIEWED_NPM_VERSION}.tgz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "${tarball}" \
            "https://registry.npmjs.org/npm/-/npm-${REVIEWED_NPM_VERSION}.tgz"
          actual_integrity="$(node - "${tarball}" <<'NODE'
          const { createHash } = require("node:crypto");
          const { readFileSync } = require("node:fs");
          const bytes = readFileSync(process.argv[2]);
          process.stdout.write(`sha512-${createHash("sha512").update(bytes).digest("base64")}`);
          NODE
          )"
          [[ "${actual_integrity}" == "${REVIEWED_NPM_INTEGRITY}" ]]
          npm install --global "${tarball}" --ignore-scripts

      - name: Download the prepared release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: .release

      - name: Verify the prepared release
        id: prepared
        shell: bash
        env:
          EXPECTED_MANIFEST_DIGEST: ${{ needs.prepare.outputs.manifest_digest }}
          RELEASE_DIRECTORY: ${{ github.workspace }}/.release
        run: |
          node <<'NODE'
          const { createHash } = require("node:crypto");
          const { appendFileSync, lstatSync, readFileSync, readdirSync } = require("node:fs");
          const { join } = require("node:path");
          const directory = process.env.RELEASE_DIRECTORY;
          const manifestPath = join(directory, "package-manifest.json");
          const manifestBytes = readFileSync(manifestPath);
          const manifestDigest = createHash("sha256").update(manifestBytes).digest("hex");
          if (manifestDigest !== process.env.EXPECTED_MANIFEST_DIGEST) {
            throw new Error("prepared package manifest digest does not match preparation");
          }
          const manifest = JSON.parse(manifestBytes);
          const record = manifest.package;
          if (
            manifest.schemaVersion !== 1 ||
            manifest.gitCommit !== process.env.RELEASE_COMMIT.toLowerCase() ||
            manifest.releaseTag !== process.env.RELEASE_TAG ||
            record?.name !== "@pegma/audit" ||
            !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(record.version) ||
            manifest.releaseTag !== `v${record.version}` ||
            !/^[0-9a-f]{64}$/.test(record.sha256) ||
            typeof record.integrity !== "string"
          ) throw new Error("prepared package manifest is invalid");
          const expectedTarball = `pegma-audit-${record.version}.tgz`;
          if (record.tarball !== expectedTarball) throw new Error("prepared tarball name is invalid");
          const entries = readdirSync(directory, { withFileTypes: true });
          const names = entries.map(({ name }) => name).sort();
          if (JSON.stringify(names) !== JSON.stringify([expectedTarball, "package-manifest.json"].sort())) {
            throw new Error("prepared release inventory is invalid");
          }
          for (const entry of entries) {
            if (!entry.isFile() || entry.isSymbolicLink() || !lstatSync(join(directory, entry.name)).isFile()) {
              throw new Error(`prepared release entry is not a regular file: ${entry.name}`);
            }
          }
          const tarballPath = join(directory, expectedTarball);
          const bytes = readFileSync(tarballPath);
          const sha256 = createHash("sha256").update(bytes).digest("hex");
          const integrity = `sha512-${createHash("sha512").update(bytes).digest("base64")}`;
          if (sha256 !== record.sha256 || integrity !== record.integrity) {
            throw new Error("prepared tarball digest does not match its manifest");
          }
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `tarball=${tarballPath}\nname=${record.name}\nversion=${record.version}\nintegrity=${record.integrity}\n`,
          );
          NODE

      - name: Publish the prepared tarball
        shell: bash
        env:
          PACKAGE_INTEGRITY: ${{ steps.prepared.outputs.integrity }}
          PACKAGE_NAME: ${{ steps.prepared.outputs.name }}
          PACKAGE_TARBALL: ${{ steps.prepared.outputs.tarball }}
          PACKAGE_VERSION: ${{ steps.prepared.outputs.version }}
        run: |
          set -euo pipefail
          publish_root="$(mktemp -d "${RUNNER_TEMP}/audit-publish.XXXXXX")"
          publish_directory="${publish_root}/work"
          config_directory="${publish_root}/config"
          mkdir -p "${publish_directory}" "${config_directory}"
          user_config="${config_directory}/user.npmrc"
          global_config="${config_directory}/global.npmrc"
          : > "${user_config}"
          : > "${global_config}"
          chmod 0600 "${user_config}" "${global_config}"

          allowed_env=(
            "CI=${CI}"
            "PATH=${PATH}"
            "HOME=${HOME}"
            "RUNNER_TEMP=${RUNNER_TEMP}"
            "NPM_CONFIG_USERCONFIG=${user_config}"
            "NPM_CONFIG_GLOBALCONFIG=${global_config}"
          )
          while IFS='=' read -r name value; do
            case "${name}" in
              TMP*|SYSTEMROOT|GITHUB_*|ACTIONS_ID_TOKEN_*) allowed_env+=("${name}=${value}") ;;
            esac
          done < <(env)
          npm_clean() {
            env -i "${allowed_env[@]}" npm "$@"
          }

          cd "${publish_directory}"
          package_spec="${PACKAGE_NAME}@${PACKAGE_VERSION}"
          view_error="${publish_root}/npm-view-error"
          if view_output="$(npm_clean view "${package_spec}" dist.integrity --json --registry https://registry.npmjs.org/ 2>"${view_error}")"; then
            registry_integrity="$(printf '%s' "${view_output}" | node -e 'const { readFileSync } = require("node:fs"); const value = JSON.parse(readFileSync(0, "utf8")); if (typeof value !== "string") process.exit(1); process.stdout.write(value);')"
            if [[ "${registry_integrity}" != "${PACKAGE_INTEGRITY}" ]]; then
              echo "::error::The registry version has different package integrity"
              exit 1
            fi
            echo "Verified existing ${package_spec}; skipping publish."
            exit 0
          elif ! grep -Eq '(^|[^A-Za-z0-9_])E404([^A-Za-z0-9_]|$)' "${view_error}"; then
            sed 's/^/::error::/' "${view_error}"
            exit 1
          fi

          npm_clean publish "${PACKAGE_TARBALL}" \
            --tag latest \
            --registry https://registry.npmjs.org/ \
            --access public \
            --provenance \
            --ignore-scripts

          for attempt in 1 2 3 4 5 6; do
            if view_output="$(npm_clean view "${package_spec}" dist.integrity --json --registry https://registry.npmjs.org/ 2>"${view_error}")"; then
              registry_integrity="$(printf '%s' "${view_output}" | node -e 'const { readFileSync } = require("node:fs"); const value = JSON.parse(readFileSync(0, "utf8")); if (typeof value !== "string") process.exit(1); process.stdout.write(value);')"
              if [[ "${registry_integrity}" == "${PACKAGE_INTEGRITY}" ]]; then exit 0; fi
            fi
            if [[ "${attempt}" -lt 6 ]]; then sleep "$((2 ** (attempt - 1)))"; fi
          done
          echo "::error::The published package integrity was not available from the registry"
          exit 1
